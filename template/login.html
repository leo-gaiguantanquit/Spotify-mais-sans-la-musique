<main class="app-main min-h-screen flex items-center justify-center">
  <form class="bg-surface rounded-2xl shadow-2xl p-8 w-full max-w-md flex flex-col gap-6">
    <h1 class="text-3xl font-bold text-main mb-2 text-center">Connexion</h1>
    <div class="flex flex-col gap-2">
      <label for="email" class="text-main font-semibold">Email</label>
      <input id="email" name="email" type="email" required class="bg-white/10 border border-white/20 rounded-lg px-4 py-2 text-main focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="Votre email">
    </div>
    <div class="flex flex-col gap-2">
      <label for="password" class="text-main font-semibold">Mot de passe</label>
      <input id="password" name="password" type="password" required class="bg-white/10 border border-white/20 rounded-lg px-4 py-2 text-main focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="Votre mot de passe">
    </div>
    <button type="submit" class="bg-green-500 hover:bg-green-400 text-black font-bold py-3 px-8 rounded-full transition-transform hover:scale-105">Se connecter</button>
    <p class="text-muted text-center text-sm">Pas encore de compte ? <a href="/register" class="text-green-500 hover:underline">Créer un compte</a></p>
  </form>
</main>
